    <title>Placivo AI — #1 AI Quiz Generator, PDF Summarizer & Placement Prep Platform</title>
    <meta name="description" content="Placivo AI is the AI operating system for college students. Generate instant practice quizzes from lecture PDFs, summarize study notes, practice DSA coding, create ATS resumes, and ace technical interviews." />
    <meta name="keywords" content="Placivo AI, AI Quiz Generator, AI PDF Quiz Generator, Quiz from PDF, Generate MCQs from PDF, AI Study Tool, AI Notes Generator, AI Flashcards, AI Mind Maps, AI Learning Platform, AI Placement Preparation, Resume Builder AI, Interview Preparation AI" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    
    <script>
      (function() {
        function logError(type, message, stack) {
          fetch('/api/log', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: type, message: message, stack: stack })
          }).catch(function() {});
        }

        window.addEventListener('error', function(e) {
          logError('error', e.message || String(e), e.error ? e.error.stack : null);
        });

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason || {};
          logError('promise_rejection', reason.message || String(reason), reason.stack);
        });

        var originalConsoleError = console.error;
        console.error = function() {
          originalConsoleError.apply(console, arguments);
          var argsArray = Array.prototype.slice.call(arguments);
          var message = argsArray.map(function(arg) {
            try {
              return typeof arg === 'object' ? JSON.stringify(arg) : String(arg);
            } catch (err) {
              return String(arg);
            }
          }).join(' ');
          logError('console_error', message);
        };
      })();
    </script>
